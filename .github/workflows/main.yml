name: Build Pico 2 UF2 (usbliter8ipad9)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Fetch Pico SDK (v2.0.0)
        run: |
          git clone --depth 1 --branch 2.0.0 https://github.com/raspberrypi/pico-sdk.git /home/runner/pico-sdk
          cd /home/runner/pico-sdk && git submodule update --init && cd ..

      - name: Setup pio_usb
        run: |
          git clone https://github.com/sekigon-gonnoc/Pico-PIO-USB.git pio_usb
          git clone https://github.com/sekigon-gonnoc/Pico-PIO-USB.git Pico-PIO-USB

      - name: Build Project
        run: |
          mkdir -p build && cd build
          export PICO_SDK_PATH=/home/runner/pico-sdk
          export CPATH=$PWD/../pio_usb/src:$PWD/../Pico-PIO-USB/src
          cmake -DPICO_BOARD=pico2 -DPICO_SDK_PATH=/home/runner/pico-sdk -DPIO_USB_PATH=$PWD/../pio_usb ..
          make -j$(nproc)

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2-firmware
          path: build/*.uf2
